services:
  - type: web
    name: voicedesk-realty-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://voicedesk-realty-wr74.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: BOLNA_WEB_CALL_ENABLED
        value: "false"
