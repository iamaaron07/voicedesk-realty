services:
  - type: web
    name: voicedesk-realty-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: BOLNA_WEB_CALL_ENABLED
        value: "false"
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: BOLNA_WEBHOOK_SECRET
        sync: false
